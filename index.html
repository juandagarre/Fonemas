<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Fonemas en Inglés</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --yellow-hl: #fef08a;
            --blue-hl: #bfdbfe;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 24px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        /* Selector de Sonido */
        .group-title {
            font-weight: bold;
            color: #334155;
            margin: 12px 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .grid-phonemes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .phoneme-card {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .phoneme-card:hover {
            border-color: var(--primary);
            background: #eff6ff;
            transform: translateY(-2px);
        }

        .phoneme-symbol {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
        }

        .phoneme-example {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Pantalla de Estudio */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            background: #e2e8f0;
            color: var(--text);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .counter {
            background: #dbeafe;
            color: var(--primary);
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .main-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius);
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            min-height: 200px;
        }

        .word-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .sentences-wrapper {
            margin-top: 16px;
            width: 100%;
        }

        .en-text {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .es-text {
            font-size: 1.05rem;
            font-weight: normal;
            color: #475569;
            line-height: 1.4;
        }

        /* Resaltados */
        .hl-yellow {
            background-color: var(--yellow-hl);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .hl-blue {
            background-color: var(--blue-hl);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Botones de Acción */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-sec {
            background: #64748b;
        }

        .btn-sec:hover {
            background: #475569;
        }

        /* Navegación Frases */
        .nav-grid {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            flex: 1;
            background: #0f172a;
        }

        .btn-nav:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- PANTALLA 1: ELECCIÓN DE SONIDO -->
        <div id="screen-select" class="screen">
            <h1>Práctica de Fonemas</h1>
            <p class="subtitle">Elige el sonido que quieres practicar</p>

            <div class="group-title">Vocales Cortas (Short Vowels)</div>
            <div class="grid-phonemes">
                <div class="phoneme-card" onclick="startStudy('/ɪ/')">
                    <div class="phoneme-symbol">/ɪ/</div>
                    <div class="phoneme-example">hit, sit, bit</div>
                </div>
            </div>
        </div>

        <!-- PANTALLA 2: APRENDIZAJE Y ESTUDIO -->
        <div id="screen-study" class="screen hidden">
            <div class="top-bar">
                <button class="btn-back" onclick="goBack()">← Volver</button>
                <div id="counter-badge" class="counter">Frase 1 / 25</div>
            </div>

            <div class="main-card">
                <div id="target-word" class="word-title">Hit</div>
                
                <div id="sentence-area" class="sentences-wrapper hidden">
                    <div id="english-text" class="en-text"></div>
                    <div id="spanish-text" class="es-text"></div>
                </div>
            </div>

            <!-- Botones principales -->
            <div class="action-grid">
                <button class="btn" onclick="playAudio('word')">🔊 Escuchar Palabra</button>
                <button class="btn" onclick="playAudio('sentence')">🔊 Escuchar Frase</button>
                <button class="btn btn-sec" onclick="showSentence()">👁️ Leer Frase</button>
                <button class="btn btn-sec" onclick="hideSentence()">🙈 Ocultar Frase</button>
            </div>

            <!-- Botones de frase anterior / siguiente -->
            <div class="nav-grid">
                <button id="btn-prev" class="btn btn-nav" onclick="prevSentence()">◀ Frase Anterior</button>
                <button id="btn-next" class="btn btn-nav" onclick="nextSentence()">Frase Siguiente ▶</button>
            </div>
        </div>
    </div>

    <script>
        // Datos del primer sonido /ɪ/
        const data = {
            "/ɪ/": [
                { word: "Hit", en: "Don't hit the glass with your spoon.", es: "No golpees el vaso con tu cuchara.", targetEn: "hit", targetEs: "golpees" },
                { word: "Sit", en: "Please sit down and make yourself comfortable.", es: "Por favor, siéntate y ponte cómodo.", targetEn: "sit", targetEs: "siéntate" },
                { word: "Bit", en: "Can I have a small bit of chocolate?", es: "¿Puedo tomar un trocito de chocolate?", targetEn: "bit", targetEs: "trocito" },
                { word: "Kit", en: "He bought a new first-aid kit for the car.", es: "Él compró un nuevo botiquín de primeros auxilios para el coche.", targetEn: "kit", targetEs: "botiquín" },
                { word: "Fit", en: "Regular exercise helps you stay fit.", es: "El ejercicio regular te ayuda a mantenerte en forma.", targetEn: "fit", targetEs: "en forma" },
                { word: "Zip", en: "Make sure to zip up your jacket, it's cold.", es: "Asegúrate de subir la cremallera de tu chaqueta, hace frío.", targetEn: "zip", targetEs: "subir la cremallera" },
                { word: "Lip", en: "She bit her lip while thinking.", es: "Ella se mordió el labio mientras pensaba.", targetEn: "lip", targetEs: "labio" },
                { word: "Tip", en: "The waiter gave us great service, so we left a tip.", es: "El camarero nos dio un gran servicio, así que dejamos propina.", targetEn: "tip", targetEs: "propina" },
                { word: "Pin", en: "Use a pin to hold the paper together.", es: "Usa un alfiler para mantener el papel unido.", targetEn: "pin", targetEs: "alfiler" },
                { word: "Bin", en: "Please throw that paper in the bin.", es: "Por favor, tira ese papel a la papelera.", targetEn: "bin", targetEs: "papelera" },
                { word: "Win", en: "We hope our team will win the match tonight.", es: "Esperamos que nuestro equipo gane el partido esta noche.", targetEn: "win", targetEs: "gane" },
                { word: "Tin", en: "Open that tin of tuna for the salad.", es: "Abre esa lata de atún para la ensalada.", targetEn: "tin", targetEs: "lata" },
                { word: "Sin", en: "They say telling a white lie is not a sin.", es: "Dicen que decir una mentirijida piadosa no es un pecado.", targetEn: "sin", targetEs: "pecado" },
                { word: "Pig", en: "The farmer feeds the pig every morning.", es: "El granjero alimenta al cerdo todas las mañanas.", targetEn: "pig", targetEs: "cerdo" },
                { word: "Dig", en: "The dog loves to dig holes in the garden.", es: "Al perro le encanta cavar hoyos en el jardín.", targetEn: "dig", targetEs: "cavar" },
                { word: "Fig", en: "She ate a sweet fresh fig from the tree.", es: "Ella se comió un higo fresco y dulce del árbol.", targetEn: "fig", targetEs: "higo" },
                { word: "Big", en: "They live in a very big house downtown.", es: "Ellos viven en una casa muy grande en el centro.", targetEn: "big", targetEs: "grande" },
                { word: "Wig", en: "The actor wore a funny wig for the play.", es: "El actor llevó una peluca divertida para la obra.", targetEn: "wig", targetEs: "peluca" },
                { word: "Ill", en: "He stayed home from work because he felt ill.", es: "Se quedó en casa sin ir a trabajar porque se sentía enfermo.", targetEn: "ill", targetEs: "enfermo" },
                { word: "Hill", en: "They climbed up the steep hill to see the view.", es: "Subieron por la empinada colina para ver las vistas.", targetEn: "hill", targetEs: "colina" },
                { word: "Milk", en: "I like to drink a glass of warm milk before bed.", es: "Me gusta beber un vaso de leche tibia antes de dormir.", targetEn: "milk", targetEs: "leche" },
                { word: "Silk", en: "This dress is made of soft silk.", es: "Este vestido está hecho de seda suave.", targetEn: "silk", targetEs: "seda" },
                { word: "Fish", en: "We saw many colorful fish while scuba diving.", es: "Vimos muchos peces de colores mientras buceábamos.", targetEn: "fish", targetEs: "peces" },
                { word: "Dish", en: "My favorite traditional dish is paella.", es: "Mi plato tradicional favorito es la paella.", targetEn: "dish", targetEs: "plato" },
                { word: "Wish", en: "Make a wish before blowing out the candles.", es: "Pide un deseo antes de apagar las velas.", targetEn: "wish", targetEs: "deseo" }
            ]
        };

        let currentPhonemeList = [];
        let index = 0;

        function startStudy(key) {
            currentPhonemeList = data[key] || [];
            index = 0;
            document.getElementById('screen-select').classList.add('hidden');
            document.getElementById('screen-study').classList.remove('hidden');
            renderCard();
        }

        function goBack() {
            stopAudio();
            document.getElementById('screen-study').classList.add('hidden');
            document.getElementById('screen-select').classList.remove('hidden');
        }

        function renderCard() {
            stopAudio();
            const current = currentPhonemeList[index];

            // Marcador
            document.getElementById('counter-badge').innerText = `Frase ${index + 1} / ${currentPhonemeList.length}`;
            
            // Palabra clave
            document.getElementById('target-word').innerText = current.word;

            // Frase Inglés (Negrita + amarillo)
            const regexEn = new RegExp(`\\b(${current.targetEn})\\b`, 'gi');
            const htmlEn = current.en.replace(regexEn, '<span class="hl-yellow">$1</span>');
            document.getElementById('english-text').innerHTML = htmlEn;

            // Frase Español (Normal + azul claro)
            const regexEs = new RegExp(`\\b(${current.targetEs})\\b`, 'gi');
            const htmlEs = current.es.replace(regexEs, '<span class="hl-blue">$1</span>');
            document.getElementById('spanish-text').innerHTML = htmlEs;

            // Ocultar frase por defecto
            hideSentence();

            // Estado de navegación
            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === currentPhonemeList.length - 1;
        }

        function showSentence() {
            document.getElementById('sentence-area').classList.remove('hidden');
        }

        function hideSentence() {
            document.getElementById('sentence-area').classList.add('hidden');
        }

        function nextSentence() {
            if (index < currentPhonemeList.length - 1) {
                index++;
                renderCard();
            }
        }

        function prevSentence() {
            if (index > 0) {
                index--;
                renderCard();
            }
        }

        // CONTROL DE AUDIO ROBUSTO (Móvil y Escritorio)
        function stopAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function playAudio(type) {
            stopAudio();
            const current = currentPhonemeList[index];
            const textToSpeak = type === 'word' ? current.word : current.en;

            // Método 1: Web Speech API del navegador
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;

                // Forzar la búsqueda de una voz en inglés disponible
                const voices = window.speechSynthesis.getVoices();
                const englishVoice = voices.find(v => v.lang.startsWith('en'));
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                // Método 2: Respaldo por audio HTML5 si el navegador no tiene síntesis nativa
                const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=${encodeURIComponent(textToSpeak)}`;
                const audio = new Audio(audioUrl);
                audio.play().catch(e => alert("Tu navegador bloquea el audio automático. Haz clic de nuevo."));
            }
        }
    </script>
</body>
</html>
