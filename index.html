<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Phonemes Trainer</title>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --accent-yellow: #fef08a;
            --accent-blue: #bfdbfe;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
                          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 30px;
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-grow: 1;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .phoneme-group-title {
            font-weight: 700;
            margin: 16px 0 8px 0;
            color: #334155;
            font-size: 1.1rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .phoneme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .phoneme-btn {
            background-color: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .phoneme-btn:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
            transform: translateY(-2px);
        }

        .phoneme-symbol {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .phoneme-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .back-btn {
            background-color: #e2e8f0;
            color: var(--text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #cbd5e1;
        }

        .counter-badge {
            background-color: #dbeafe;
            color: var(--primary-color);
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius);
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            min-height: 220px;
        }

        .target-word {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .sentence-box {
            margin-top: 16px;
            width: 100%;
        }

        .english-sentence {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .spanish-sentence {
            font-size: 1.1rem;
            font-weight: normal;
            color: #475569;
            line-height: 1.5;
        }

        .hl-en {
            background-color: var(--accent-yellow);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .hl-es {
            background-color: var(--accent-blue);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 46px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #64748b;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .nav-btn {
            flex: 1;
            background-color: #334155;
        }

        .nav-btn:hover {
            background-color: #1e293b;
        }

        .nav-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        #speech-status {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 10px;
            min-height: 20px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .target-word {
                font-size: 2rem;
            }

            .header-nav {
                flex-wrap: wrap;
            }

            .counter-badge {
                font-size: 0.85rem;
            }

            .english-sentence {
                font-size: 1.1rem;
            }

            .spanish-sentence {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- PANTALLA 1: SELECCIÓN DE FONEMA -->

        <div id="selection-screen" class="screen">

            <h1>Entrenador de Fonemas de Inglés</h1>

            <p class="subtitle">
                Selecciona el sonido que deseas practicar hoy
            </p>

            <div class="phoneme-group-title">
                Vocales Cortas (Short Vowels)
            </div>

            <div class="phoneme-grid">

                <button class="phoneme-btn" onclick="startStudy('/ɪ/')">
                    <div class="phoneme-symbol">/ɪ/</div>
                    <div class="phoneme-desc">bit, hit, sit</div>
                </button>

            </div>

        </div>


        <!-- PANTALLA 2: ESTUDIO -->

        <div id="study-screen" class="screen hidden">

            <div class="header-nav">

                <button class="back-btn" onclick="showSelectionScreen()">
                    ← Cambiar Sonido
                </button>

                <div class="counter-badge" id="counter">
                    Frase 1 / 25
                </div>

            </div>


            <div class="card">

                <div id="target-word" class="target-word">
                    Hit
                </div>

                <div id="sentence-container" class="sentence-box hidden">

                    <div id="english-sentence" class="english-sentence"></div>

                    <div id="spanish-sentence" class="spanish-sentence"></div>

                </div>

            </div>


            <!-- BOTONES DE ACCIÓN -->

            <div class="controls-grid">

                <button class="btn" onclick="speakWord()">
                    🔊 Escuchar Palabra
                </button>

                <button class="btn" onclick="speakSentence()">
                    🔊 Escuchar Frase
                </button>

                <button class="btn btn-secondary" onclick="showSentence()">
                    👁️ Leer Frase
                </button>

                <button class="btn btn-secondary" onclick="hideSentence()">
                    🙈 Ocultar Frase
                </button>

            </div>


            <!-- BOTONES DE NAVEGACIÓN -->

            <div class="nav-buttons">

                <button id="prev-btn" class="btn nav-btn" onclick="prevSentence()">
                    ◀ Anterior
                </button>

                <button id="next-btn" class="btn nav-btn" onclick="nextSentence()">
                    Siguiente ▶
                </button>

            </div>

            <div id="speech-status" role="status" aria-live="polite"></div>

        </div>

    </div>


    <script>
        // =====================================================
        // DATOS DE LOS FONEMAS
        // =====================================================

        const phonemeData = {
            "/ɪ/": [
                {
                    word: "Hit",
                    en: "Don't hit the glass with your spoon.",
                    es: "No golpees el vaso con tu cuchara.",
                    targetEn: "hit",
                    targetEs: "golpees"
                },
                {
                    word: "Sit",
                    en: "Please sit down and make yourself comfortable.",
                    es: "Por favor, siéntate y ponte cómodo.",
                    targetEn: "sit",
                    targetEs: "siéntate"
                },
                {
                    word: "Bit",
                    en: "Can I have a small bit of chocolate?",
                    es: "¿Puedo tomar un trocito de chocolate?",
                    targetEn: "bit",
                    targetEs: "trocito"
                },
                {
                    word: "Kit",
                    en: "He bought a new first-aid kit for the car.",
                    es: "Él compró un nuevo botiquín de primeros auxilios para el coche.",
                    targetEn: "kit",
                    targetEs: "botiquín"
                },
                {
                    word: "Fit",
                    en: "Regular exercise helps you stay fit.",
                    es: "El ejercicio regular te ayuda a mantenerte en forma.",
                    targetEn: "fit",
                    targetEs: "en forma"
                },
                {
                    word: "Zip",
                    en: "Make sure to zip up your jacket, it's cold.",
                    es: "Asegúrate de subir la cremallera de tu chaqueta, hace frío.",
                    targetEn: "zip",
                    targetEs: "subir la cremallera"
                },
                {
                    word: "Lip",
                    en: "She bit her lip while thinking.",
                    es: "Ella se mordió el labio mientras pensaba.",
                    targetEn: "lip",
                    targetEs: "labio"
                },
                {
                    word: "Tip",
                    en: "The waiter gave us great service, so we left a tip.",
                    es: "El camarero nos dio un gran servicio, así que dejamos propina.",
                    targetEn: "tip",
                    targetEs: "propina"
                },
                {
                    word: "Pin",
                    en: "Use a pin to hold the paper together.",
                    es: "Usa un alfiler para mantener el papel unido.",
                    targetEn: "pin",
                    targetEs: "alfiler"
                },
                {
                    word: "Bin",
                    en: "Please throw that paper in the bin.",
                    es: "Por favor, tira ese papel a la papelera.",
                    targetEn: "bin",
                    targetEs: "papelera"
                },
                {
                    word: "Win",
                    en: "We hope our team will win the match tonight.",
                    es: "Esperamos que nuestro equipo gane el partido esta noche.",
                    targetEn: "win",
                    targetEs: "gane"
                },
                {
                    word: "Tin",
                    en: "Open that tin of tuna for the salad.",
                    es: "Abre esa lata de atún para la ensalada.",
                    targetEn: "tin",
                    targetEs: "lata"
                },
                {
                    word: "Sin",
                    en: "They say telling a white lie is not a sin.",
                    es: "Dicen que decir una mentira piadosa no es un pecado.",
                    targetEn: "sin",
                    targetEs: "pecado"
                },
                {
                    word: "Pig",
                    en: "The farmer feeds the pig every morning.",
                    es: "El granjero alimenta al cerdo todas las mañanas.",
                    targetEn: "pig",
                    targetEs: "cerdo"
                },
                {
                    word: "Dig",
                    en: "The dog loves to dig holes in the garden.",
                    es: "Al perro le encanta cavar hoyos en el jardín.",
                    targetEn: "dig",
                    targetEs: "cavar"
                },
                {
                    word: "Fig",
                    en: "She ate a sweet fresh fig from the tree.",
                    es: "Ella se comió un higo fresco y dulce del árbol.",
                    targetEn: "fig",
                    targetEs: "higo"
                },
                {
                    word: "Big",
                    en: "They live in a very big house downtown.",
                    es: "Ellos viven en una casa muy grande en el centro.",
                    targetEn: "big",
                    targetEs: "grande"
                },
                {
                    word: "Wig",
                    en: "The actor wore a funny wig for the play.",
                    es: "El actor llevó una peluca divertida para la obra.",
                    targetEn: "wig",
                    targetEs: "peluca"
                },
                {
                    word: "Ill",
                    en: "He stayed home from work because he felt ill.",
                    es: "Se quedó en casa sin ir a trabajar porque se sentía enfermo.",
                    targetEn: "ill",
                    targetEs: "enfermo"
                },
                {
                    word: "Hill",
                    en: "They climbed up the steep hill to see the view.",
                    es: "Subieron por la empinada colina para ver las vistas.",
                    targetEn: "hill",
                    targetEs: "colina"
                },
                {
                    word: "Milk",
                    en: "I like to drink a glass of warm milk before bed.",
                    es: "Me gusta beber un vaso de leche tibia antes de dormir.",
                    targetEn: "milk",
                    targetEs: "leche"
                },
                {
                    word: "Silk",
                    en: "This dress is made of soft silk.",
                    es: "Este vestido está hecho de seda suave.",
                    targetEn: "silk",
                    targetEs: "seda"
                },
                {
                    word: "Fish",
                    en: "We saw many colorful fish while scuba diving.",
                    es: "Vimos muchos peces de colores mientras buceábamos.",
                    targetEn: "fish",
                    targetEs: "peces"
                },
                {
                    word: "Dish",
                    en: "My favorite traditional dish is paella.",
                    es: "Mi plato tradicional favorito es la paella.",
                    targetEn: "dish",
                    targetEs: "plato"
                },
                {
                    word: "Wish",
                    en: "Make a wish before blowing out the candles.",
                    es: "Pide un deseo antes de apagar las velas.",
                    targetEn: "wish",
                    targetEs: "deseo"
                }
            ]
        };


        // =====================================================
        // VARIABLES
        // =====================================================

        let currentList = [];
        let currentIndex = 0;
        let englishVoice = null;
        let speechRequestId = 0;


        // =====================================================
        // COMPROBAR SOPORTE DE VOZ
        // =====================================================

        function speechSupported() {
            return (
                "speechSynthesis" in window &&
                "SpeechSynthesisUtterance" in window
            );
        }


        // =====================================================
        // BUSCAR VOCES INGLESAS
        // =====================================================

        function initVoices() {
            if (!speechSupported()) {
                return;
            }

            const voices = window.speechSynthesis.getVoices();

            if (!voices || voices.length === 0) {
                englishVoice = null;
                return;
            }

            // Prioridad:
            // 1. Inglés de Estados Unidos.
            // 2. Inglés británico.
            // 3. Cualquier otra voz inglesa.

            englishVoice =
                voices.find(v => v.lang.toLowerCase() === "en-us") ||
                voices.find(v => v.lang.toLowerCase() === "en-gb") ||
                voices.find(v => v.lang.toLowerCase().startsWith("en-")) ||
                voices.find(v => v.lang.toLowerCase().startsWith("en")) ||
                null;
        }


        // Cargar las voces cuando el navegador las facilite.

        if (speechSupported()) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices();
        }


        // =====================================================
        // REPRODUCCIÓN DE VOZ
        // =====================================================

        function speakText(text) {
    const synth = window.speechSynthesis;

    if (!synth) {
        document.getElementById("speech-status").textContent =
            "Este navegador no admite la síntesis de voz.";
        return;
    }

    // Cancelar cualquier reproducción anterior
    synth.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    // Pedir inglés y dejar que Android elija la voz disponible
    utterance.lang = "en-US";
    utterance.rate = 0.85;
    utterance.pitch = 1;

    utterance.onstart = function () {
        document.getElementById("speech-status").textContent =
            "Reproduciendo audio...";
    };

    utterance.onend = function () {
        document.getElementById("speech-status").textContent =
            "Audio terminado.";
    };

    utterance.onerror = function (event) {
        document.getElementById("speech-status").textContent =
            "Error de audio: " + event.error;
        console.error("Error de síntesis de voz:", event);
    };

    // Dar tiempo a Android para cancelar el audio anterior
    setTimeout(function () {
        try {
            synth.speak(utterance);
        } catch (error) {
            document.getElementById("speech-status").textContent =
                "No se pudo iniciar el audio: " + error.message;
            console.error(error);
        }
    }, 300);
}

                
                


        // =====================================================
        // INICIAR ESTUDIO
        // =====================================================

        function startStudy(phonemeKey) {

            currentList = phonemeData[phonemeKey] || [];
            currentIndex = 0;

            if (currentList.length === 0) {
                return;
            }

            document
                .getElementById("selection-screen")
                .classList.add("hidden");

            document
                .getElementById("study-screen")
                .classList.remove("hidden");

            loadCardData();
        }


        // =====================================================
        // VOLVER A SELECCIÓN
        // =====================================================

        function showSelectionScreen() {

            if (speechSupported()) {
                ++speechRequestId;
                window.speechSynthesis.cancel();
            }

            document
                .getElementById("study-screen")
                .classList.add("hidden");

            document
                .getElementById("selection-screen")
                .classList.remove("hidden");

            document.getElementById("speech-status").textContent = "";
        }


        // =====================================================
        // CARGAR PALABRA Y FRASES
        // =====================================================

        function loadCardData() {

            if (speechSupported()) {
                ++speechRequestId;
                window.speechSynthesis.cancel();
            }

            if (
                !currentList.length ||
                currentIndex < 0 ||
                currentIndex >= currentList.length
            ) {
                return;
            }

            const item = currentList[currentIndex];

            document.getElementById("counter").innerText =
                `Frase ${currentIndex + 1} / ${currentList.length}`;

            document.getElementById("target-word").innerText =
                item.word;

            const highlightedEn = item.en.replace(
                new RegExp(`\\b(${item.targetEn})\\b`, "gi"),
                '<span class="hl-en">$1</span>'
            );

            document.getElementById("english-sentence").innerHTML =
                highlightedEn;

            const highlightedEs = item.es.replace(
                new RegExp(`\\b(${item.targetEs})\\b`, "gi"),
                '<span class="hl-es">$1</span>'
            );

            document.getElementById("spanish-sentence").innerHTML =
                highlightedEs;

            hideSentence();

            document.getElementById("prev-btn").disabled =
                currentIndex === 0;

            document.getElementById("next-btn").disabled =
                currentIndex === currentList.length - 1;

            document.getElementById("speech-status").textContent = "";
        }


        // =====================================================
        // MOSTRAR Y OCULTAR FRASE
        // =====================================================

        function showSentence() {

            document
                .getElementById("sentence-container")
                .classList.remove("hidden");
        }


        function hideSentence() {

            document
                .getElementById("sentence-container")
                .classList.add("hidden");
        }


        // =====================================================
        // NAVEGACIÓN ENTRE FRASES
        // =====================================================

        function nextSentence() {

            if (currentIndex < currentList.length - 1) {
                currentIndex++;
                loadCardData();
            }
        }


        function prevSentence() {

            if (currentIndex > 0) {
                currentIndex--;
                loadCardData();
            }
        }


        // =====================================================
        // BOTÓN: ESCUCHAR PALABRA
        // =====================================================

        function speakWord() {

            if (!currentList.length) {
                return;
            }

            const item = currentList[currentIndex];

            if (item) {
                speakText(item.word, 0.85);
            }
        }


        // =====================================================
        // BOTÓN: ESCUCHAR FRASE
        // =====================================================

        function speakSentence() {

            if (!currentList.length) {
                return;
            }

            const item = currentList[currentIndex];

            if (item) {
                speakText(item.en, 0.9);
            }
        }

    </script>

</body>
</html>
